<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Everything is served from the app's own virtual host; no remote origins are allowed. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'" />
  <title>Carbon Editor</title>
  <link rel="stylesheet" href="./main.css" />
  <style>
    html, body, #editor { margin: 0; height: 100%; width: 100%; overflow: hidden; background: transparent; }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
